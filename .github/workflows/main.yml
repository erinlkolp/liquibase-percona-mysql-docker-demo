name: Liquibase Continuous Integration

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'bugfix/**'
      - 'staging'
  pull_request:
    branches:
      - 'main'
      - 'staging'

jobs:
  ci:
    name: "Liquibase Continuous Integration Pipeline"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      LIQUIBASE_USERNAME: root
      LIQUIBASE_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker Compose
        uses: KengoTODA/actions-setup-docker-compose@v1
        with:
          version: '2.15.1'

      - name: Build Liquibase Container
        id: buildlbcontainer
        run: docker-compose build

      - name: Run Migrations
        id: runmigrations
        # Starts db, waits for it to pass its health check, then starts
        # liquibase. Exits with liquibase's exit code so the step fails
        # on any migration error.
        run: docker-compose up --exit-code-from liquibase

      - name: Tear Down Services
        if: always()
        run: docker-compose down --volumes --remove-orphans
