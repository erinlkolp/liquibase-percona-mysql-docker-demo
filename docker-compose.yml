services:
  db:
    container_name: db
    image: percona/percona-server:8.0.39
    restart: always
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      # This auto-loads our base db and schema without 3rd party tools or scripts.
      - ./demodb.sql:/docker-entrypoint-initdb.d/1.sql
    healthcheck:
      # Verifies MySQL has finished init scripts and demodb is accessible before
      # starting dependent services. Using mysql -e rather than mysqladmin ping
      # so we wait for the full init phase (including demodb.sql) to complete.
      test: ["CMD", "mysql", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1", "demodb"]
      interval: 15s
      retries: 5
      start_period: 30s
      timeout: 5s

  liquibase:
    image: ekolp/liquibase:latest
    container_name: liquibase
    command: --defaults-file=/liquibase/liquibase.properties update
    environment:
      - INSTALL_MYSQL=true
      - LIQUIBASE_COMMAND_USERNAME=${LIQUIBASE_USERNAME}
      - LIQUIBASE_COMMAND_PASSWORD=${LIQUIBASE_PASSWORD}
    build:
      context: ./
      dockerfile: Dockerfile
    volumes:
      - ./liquibase.properties:/liquibase/liquibase.properties
      - ./changelog.xml:/liquibase/changelog.xml
      - ./schema/:/liquibase/schema/
    depends_on:
      db:
        condition: service_healthy
